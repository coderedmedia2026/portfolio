amp(12px,1.55vw,18px);text-align:right;letter-spacing:.02em;white-space:nowrap;overflow:visible;text-overflow:clip;min-width:0;font-variant-numeric:tabular-nums}.controls{display:grid;grid-template-columns:minmax(190px,.9fr) 1fr auto;gap:18px;align-items:center;margin-top:20px}.plastic-button,.mini-button,.mode-button{position:relative;border:none;color:var(--button-text);cursor:pointer;outline:none;transition:transform 120ms ease,box-shadow 120ms ease,filter 120ms ease;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.plastic-button::before,.mini-button::before,.mode-button::before{content:"";position:absolute;left:8%;right:8%;top:7%;height:38%;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.03));pointer-events:none}.plastic-button{border-radius:22px;padding:18px 18px 20px;min-height:86px;font-size:clamp(18px,2.2vw,22px);background:linear-gradient(180deg,var(--accent-2) 0%,#e3a24d 28%,#ca8238 66%,#915020 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(66,31,0,.32),0 8px 18px rgba(0,0,0,.3);color:#fff7ee;text-shadow:0 1px 0 rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.16)}.plastic-button:active,.plastic-button.pressed,.mini-button:active,.mini-button.pressed,.mode-button:active,.mode-button.pressed{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 6px 10px rgba(0,0,0,.24),0 4px 10px rgba(0,0,0,.24)}.mini-button,.mode-button{border-radius:16px;padding:10px 14px 12px;min-height:48px;min-width:78px;font-size:14px;background:linear-gradient(180deg,#6d7886 0%,#4f5964 34%,#343b44 72%,#252a30 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.3),0 7px 14px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12)}.mode-button.active,.mini-button.active{background:linear-gradient(180deg,#858f9b 0%,#59626f 32%,#3d454f 70%,#2b3036 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.38),0 0 0 1px rgba(255,201,120,.16),0 8px 20px rgba(0,0,0,.3)}#unitButton{text-transform:none}.swing-section{display:grid;grid-template-columns:auto minmax(180px,1fr);align-items:center;gap:14px;min-width:0}.small-label{font-size:clamp(14px,1.4vw,16px);letter-spacing:.2em;color:#d4dce3;white-space:nowrap}.slider-wrap{display:grid;gap:7px;min-width:0}input[type="range"]{width:100%;appearance:none;height:12px;border-radius:999px;background:linear-gradient(180deg,#14191f,#1d242c);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);outline:none}input[type="range"]::-webkit-slider-thumb{appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.7),rgba(255,255,255,.2) 35%,transparent 36%),linear-gradient(180deg,#f8f9fb,#c0cad5 42%,#8a97a6 78%,#667281);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 -2px 2px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.4);cursor:ew-resize}input[type="range"]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#f8f9fb,#c0cad5 42%,#8a97a6 78%,#667281);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 -2px 2px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.4);cursor:ew-resize}.swing-meta{display:flex;justify-content:space-between;font-size:12px;color:#bcc6d0;letter-spacing:.08em;gap:10px}.button-pair{display:flex;align-items:center;gap:12px}.assist{position:absolute;bottom:10px;left:16px;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.48)}@media (max-width:980px){:root{--device-scale:.72}}@media (max-width:820px){:root{--device-scale:.68}.device{border-radius:28px}.screen{min-height:330px}.controls{grid-template-columns:1fr;gap:16px}.button-pair{justify-content:flex-end}}@media (max-width:640px){:root{--device-scale:1}html,body{padding:4px}.stage{width:100%;min-height:calc(100svh - 8px)}.device{width:min(100%,720px);transform:none;padding:20px 12px 16px;border-radius:24px}.screen-wrap{padding:12px;border-radius:20px}.screen{padding:13px 8px;min-height:320px}.grid{gap:6px}.grid-head,.grid-row{gap:4px;grid-template-columns:minmax(42px,.74fr) repeat(3,minmax(0,1fr))}.grid-head{padding:0 4px 5px}.grid-row{padding:7px 4px}.display-header{font-size:clamp(9px,2.55vw,12px);letter-spacing:.03em}.note-name{font-size:clamp(11px,3vw,15px);gap:4px;letter-spacing:.01em}.readout{font-size:clamp(10px,2.65vw,13px);letter-spacing:0}.logo{letter-spacing:.16em;padding:9px 16px}.swing-section{grid-template-columns:1fr}.small-label{justify-self:start}.button-pair{justify-content:space-between}.mini-button,.mode-button{width:calc(50% - 6px)}}@media (max-width:420px){.device{padding:16px 8px 12px}.screen-wrap{padding:8px}.screen{padding:12px 5px}.grid-head,.grid-row{gap:2px;grid-template-columns:minmax(36px,.62fr) repeat(3,minmax(0,1fr))}.grid-row{padding:6px 3px}.display-header{font-size:clamp(8px,2.45vw,10px)}.note-name{font-size:clamp(10px,2.9vw,13px)}.readout{font-size:clamp(9px,2.48vw,11px)}.bpm-value{font-size:clamp(42px,14vw,58px)}}</style></head><body><div class="stage"><div class="device" aria-label="TIME TOOL tempo and delay calculator"><div class="header"><button class="logo" id="logoButton" title="Click to enter BPM, or drag up/right to increase and down/left to decrease">TIME TOOL</button></div><div class="screen-wrap"><div class="screen"><div class="bpm-block"><div class="bpm-label">BPM</div><div class="bpm-value" id="bpmValue" title="Click to enter BPM, or drag to adjust">120.0</div></div><div class="grid"><div class="grid-head"><div class="display-header">Note</div><div class="display-header" style="text-align:right">Regular</div><div class="display-header" style="text-align:right">Dotted</div><div class="display-header" style="text-align:right">Triplet</div></div><div id="rows"></div></div></div></div><div class="controls"><button class="plastic-button" id="tapButton" title="Tap repeatedly to set tempo">Tap Tempo</button><div class="swing-section"><div class="small-label">SWING</div><div class="slider-wrap"><input id="swingSlider" type="range" min="0" max="100" value="0" /><div class="swing-meta"><span id="swingPercent">0%</span><span id="swingRatio">0</span></div></div></div><div class="button-pair"><button class="mini-button active" id="swingTargetButton" title="Choose the note value to swing">♪ 1/8</button><button class="mode-button" id="unitButton" title="Switch between milliseconds and hertz">ms</button></div></div></div></div><script>(() => {const noteDefs = [{ key: '1/2', label: '1/2', factor: 2 },{ key: '1/4', label: '1/4', factor: 1 },{ key: '1/8', label: '1/8', factor: 0.5 },{ key: '1/16', label: '1/16', factor: 0.25 },{ key: '1/32', label: '1/32', factor: 0.125 },];const state = {bpm: 120,unit: 'ms',swing: 0,swingTarget: '1/8',taps: [],};const rowsEl = document.getElementById('rows');const bpmValueEl = document.getElementById('bpmValue');const tapButton = document.getElementById('tapButton');const unitButton = document.getElementById('unitButton');const swingSlider = document.getElementById('swingSlider');const swingTargetButton = document.getElementById('swingTargetButton');const swingPercent = document.getElementById('swingPercent');const swingRatio = document.getElementById('swingRatio');const logoButton = document.getElementById('logoButton');function clamp(value, min, max) {return Math.min(max, Math.max(min, value));}function round(value, places = 1) {const p = Math.pow(10, places);return Math.round(value * p) / p;}function formatTime(ms) {if (state.unit === 'ms') {return ms >= 100 ? `${round(ms, 1).toFixed(1)} ms` : `${round(ms, 2).toFixed(2)} ms`;}const hz = 1000 / ms;return hz >= 10 ? `${round(hz, 2).toFixed(2)} Hz` : `${round(hz, 3).toFixed(3)} Hz`;}function calcBaseMs() {return 60000 / state.bpm;}function swingMultiplier() {return 1 + (state.swing / 100) / 3;}function getSwingRatioText() {if (state.swing <= 0) return '0';const pct = state.swing / 100;const left = Math.round((0.5 + pct / 6) * 100);const right = 100 - left;return `${left}/${right}`;}function createRow(def) {const row = document.createElement('div');row.className = 'grid-row';row.dataset.key = def.key;row.innerHTML = `<div class="note-name"><span>${def.label}</span></div><div class="readout regular"></div><div class="readout dotted"></div><div class="readout triplet"></div>`;return row;}function getSwingTargetLabel() {return state.swingTarget === '1/8' ? '♪ 1/8' : '♬ 1/16';}function renderRows() {if (!rowsEl.childElementCount) {noteDefs.forEach(def => rowsEl.appendChild(createRow(def)));}const quarterMs = calcBaseMs();swingPercent.textContent = `${state.swing}%`;swingRatio.textContent = getSwingRatioText();unitButton.textContent = state.unit === 'ms' ? 'ms' : 'Hz';swingTargetButton.textContent = getSwingTargetLabel();[...rowsEl.children].forEach((row, idx) => {const def = noteDefs[idx];const base = quarterMs * def.factor;const dotted = base * 1.5;const triplet = base * (2 / 3);let regularValue = base;let dottedValue = dotted;let tripletValue = triplet;const isSwingRow = state.swing > 0 && def.key === state.swingTarget;if (isSwingRow) {const mult = swingMultiplier();regularValue *= mult;dottedValue *= mult;tripletValue *= mult;}row.querySelector('.regular').textContent = formatTime(regularValue);row.querySelector('.dotted').textContent = formatTime(dottedValue);row.querySelector('.triplet').textContent = formatTime(tripletValue);row.classList.toggle('swing-active', isSwingRow);});}function render() {bpmValueEl.textContent = round(state.bpm, 1).toFixed(1);renderRows();}function setBpm(nextBpm) {state.bpm = clamp(round(Number(nextBpm), 1), 20, 400);render();}function animatePress(el) {el.classList.add('pressed');window.setTimeout(() => el.classList.remove('pressed'), 120);}function registerDragTempo(el) {let dragging = false;let moved = false;let startX = 0;let startY = 0;let startBpm = 0;el.addEventListener('pointerdown', (e) => {dragging = true;moved = false;startX = e.clientX;startY = e.clientY;startBpm = state.bpm;el.classList.add('dragging');el.setPointerCapture?.(e.pointerId);});el.addEventListener('pointermove', (e) => {if (!dragging) return;const dx = e.clientX - startX;const dy = startY - e.clientY;const delta = (dx + dy) / 5;if (Math.abs(delta) > 0.2) moved = true;setBpm(startBpm + delta);});function endDrag(e) {if (!dragging) return;dragging = false;el.classList.remove('dragging');el.releasePointerCapture?.(e.pointerId);if (!moved) {const entered = prompt('Set BPM (20–400):', String(round(state.bpm, 1)));if (entered !== null && entered.trim() !== '') {const value = Number(entered);if (!Number.isNaN(value)) setBpm(value);}}}el.addEventListener('pointerup', endDrag);el.addEventListener('pointercancel', endDrag);el.addEventListener('lostpointercapture', () => {dragging = false;el.classList.remove('dragging');});}function handleTap() {animatePress(tapButton);const now = performance.now();const taps = state.taps;if (taps.length && now - taps[taps.length - 1] > 2200) {taps.length = 0;}taps.push(now);if (taps.length > 8) taps.shift();if (taps.length >= 2) {const intervals = [];for (let i = 1; i < taps.length; i++) {intervals.push(taps[i] - taps[i - 1]);}const avg = intervals.reduce((a, b) => a + b, 0) / intervals.length;const bpm = 60000 / avg;setBpm(bpm);}}tapButton.addEventListener('click', handleTap);document.addEventListener('keydown', (e) => {if (e.code === 'Space' && !e.repeat && !/input|textarea|select/i.test(document.activeElement?.tagName || '')) {e.preventDefault();handleTap();}});unitButton.addEventListener('click', () => {animatePress(unitButton);state.unit = state.unit === 'ms' ? 'hz' : 'ms';render();});swingTargetButton.addEventListener('click', () => {animatePress(swingTargetButton);state.swingTarget = state.swingTarget === '1/8' ? '1/16' : '1/8';render();});swingSlider.addEventListener('input', () => {state.swing = Number(swingSlider.value);render();});registerDragTempo(logoButton);registerDragTempo(bpmValueEl);document.querySelectorAll('.plastic-button, .mini-button, .mode-button').forEach((btn) => {btn.addEventListener('pointerdown', () => btn.classList.add('pressed'));btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));});render();})();</script></body></html>
