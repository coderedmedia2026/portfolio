<script>
"use strict";

/* Embedded oscillator/mixer component from oscillators-mixer.component.js */
/*
  SUPERSYNTH COMPONENT: OSCILLATORS + MIXER
  File: supersynth-oscillators-mixer.component.js

  WHAT THIS IS
  - Complete oscillator/mixer component for the larger Super Synth build.
  - No keyboard, no test filter, no internal test LFOs, no internal test envelopes, no UI.
  - The host program provides note events plus modulation signals.

  FINAL AUDIO OUTPUT
  - instance.output : connect this to the next synth component, usually filter.input.

  MODULATION INPUTS PROVIDED BY THIS COMPONENT
  - instance.modInputs.modEnv1.input
  - instance.modInputs.modEnv2.input
  - instance.modInputs.modEnv3.input
  - instance.modInputs.lfo1.input
  - instance.modInputs.lfo2.input
  - instance.modInputs.lfo3.input
  - instance.modInputs.lfo4.input

  EXPECTED MOD SIGNALS
  - Mod envelopes: unipolar 0..1.
  - LFOs: bipolar -1..+1.

  OSCILLATOR SUMMARY
  - Two identical oscillator blocks.
  - High-quality PeriodicWave oscillators with per-note harmonic limiting.
  - Waveform knob is continuous and loops through:
    sine -> triangle -> saw -> 25% pulse -> square -> 10% pulse ->
    16 spectral waveforms -> sine.
  - Waveform modulation source per oscillator:
    modEnv1, modEnv2, modEnv3, lfo1, lfo2, lfo3, lfo4.
  - Pitch modulation uses selected source as well; default source is lfo1.
  - Final oscillator/mixer output includes osc1, osc2, noise, and sub oscillator.

  HOST INTEGRATION EXAMPLE
    const ctx = new AudioContext();
    const osc = new SuperSynthOscillatorsMixer(ctx);

    masterLFO1.output.connect(osc.modInputs.lfo1.input);
    modEnvelope1.output.connect(osc.modInputs.modEnv1.input);

    osc.output.connect(filter.input);
    osc.noteOn(60, 1.0);
    osc.noteOff(60);
*/

(function (global) {
  "use strict";

  const MOD_SOURCES = ["modEnv1", "modEnv2", "modEnv3", "modEnv4", "lfo1", "lfo2", "lfo3", "lfo4"];
  const LFO_SOURCES = new Set(["lfo1", "lfo2", "lfo3", "lfo4"]);
  const ENV_SOURCES = new Set(["modEnv1", "modEnv2", "modEnv3", "modEnv4"]);

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
  function semisToRatio(semitones) { return Math.pow(2, semitones / 12); }
  function centsToRatio(cents) { return Math.pow(2, cents / 1200); }

  function wrapWavePosition(v) {
    // 0 sine ... 21 spectral 16 ... 22 returns to sine.
    const max = 22;
    return ((v % max) + max) % max;
  }

  const DEFAULT_PARAMS = {
    osc1: {
      wave: 2.15,                 // 0..22 continuous looping waveform path
      pitch: 0,                   // semitones, recommended range +/-24
      fine: 0,                    // cents, recommended range +/-50
      pitchModSource: "lfo1",     // modEnv1..3 or lfo1..4
      pitchModDepth: 4,           // cents
      waveModSource: "lfo1",      // modEnv1..3 or lfo1..4
      waveModDepth: 0.30,         // waveform-index distance
      volume: 0.55,
      character: 0.22             // subtle shaper drive
    },
    osc2: {
      wave: 1.10,
      pitch: -12,
      fine: 7,
      pitchModSource: "lfo1",
      pitchModDepth: 2,
      waveModSource: "lfo2",
      waveModDepth: 0.20,
      volume: 0.42,
      character: 0.22
    },
    mixer: {
      noiseVolume: 0.03,
      subVolume: 0.18,
      masterVolume: 0.72
    },
    voice: {
      attack: 0.010,
      release: 0.025,
      cleanupMs: 240
    }
  };

  class SuperSynthOscillatorsMixer {
    constructor(audioContext, options = {}) {
      if (!audioContext) throw new Error("SuperSynthOscillatorsMixer requires an AudioContext.");

      this.ctx = audioContext;
      this.params = this._mergeParams(DEFAULT_PARAMS, options.params || {});
      this.voices = new Map();
      this.waveCache = new Map();
      this.lastMidi = null;

      // FINAL MIXER OUTPUT: connect to filter/input of next component.
      this.output = this.ctx.createGain();
      this.output.gain.value = this.params.mixer.masterVolume;

      // ROUTING INPUTS: host connects modulation sources here.
      this.modInputs = {};
      MOD_SOURCES.forEach((name) => {
        const input = this.ctx.createGain();
        input.gain.value = 1;
        this.modInputs[name] = { input, type: LFO_SOURCES.has(name) ? "bipolar" : "unipolar" };
      });
    }

    connect(destination) {
      this.output.connect(destination.input || destination);
      return destination;
    }

    disconnect() {
      this.output.disconnect();
    }

    noteOn(midi, velocity = 1) {
      if (this.voices.has(midi)) return this.voices.get(midi);

      const now = this.ctx.currentTime;
      const voiceOutput = this.ctx.createGain();
      voiceOutput.gain.setValueAtTime(0, now);
      voiceOutput.gain.linearRampToValueAtTime(clamp(velocity, 0, 1), now + this.params.voice.attack);
      voiceOutput.connect(this.output);

      const nodes = [];
      const glideFromMidi = (this.params.voice.portamento > 0 && this.lastMidi !== null) ? this.lastMidi : midi;
      const pitchDistance = Math.abs(midi - glideFromMidi);
      const portamentoBase = clamp(this.params.voice.portamento || 0, 0, 5);
      const portamentoTime = this.params.voice.portamentoMode === "pitch" ? portamentoBase * clamp(pitchDistance / 24, 0.02, 1) : portamentoBase;
      nodes.push(...this._createOscillatorBlock(midi, this.params.osc1, voiceOutput, 1, glideFromMidi, portamentoTime));
      nodes.push(...this._createOscillatorBlock(midi, this.params.osc2, voiceOutput, 2, glideFromMidi, portamentoTime));
      nodes.push(...this._createSubOscillator(midi, voiceOutput, glideFromMidi, portamentoTime));
      this.lastMidi = midi;
      nodes.push(...this._createNoiseSource(voiceOutput));

      const voice = {
        midi,
        output: voiceOutput,
        nodes,
        stop: () => this.noteOff(midi)
      };

      this.voices.set(midi, voice);
      return voice;
    }

    noteOff(midi) {
      const voice = this.voices.get(midi);
      if (!voice) return;

      const t = this.ctx.currentTime;
      voice.output.gain.cancelScheduledValues(t);
      voice.output.gain.setTargetAtTime(0, t, this.params.voice.release);

      setTimeout(() => {
        voice.nodes.forEach((node) => {
          try { if (node.stop) node.stop(); } catch (_) {}
          try { if (node.disconnect) node.disconnect(); } catch (_) {}
        });
        try { voice.output.disconnect(); } catch (_) {}
      }, this.params.voice.cleanupMs);

      this.voices.delete(midi);
    }

    panic() {
      Array.from(this.voices.keys()).forEach((midi) => this.noteOff(midi));
    }

    setParam(path, value) {
      const parts = path.split(".");
      let target = this.params;
      for (let i = 0; i < parts.length - 1; i++) target = target[parts[i]];
      target[parts[parts.length - 1]] = value;

      // Live global mixer update. Oscillator waveform/pitch settings apply to newly triggered voices.
      if (path === "mixer.masterVolume") {
        this.output.gain.setTargetAtTime(value, this.ctx.currentTime, 0.01);
      }
      if (path === "osc1.character" || path === "osc2.character") {
        const oscNumber = path === "osc1.character" ? 1 : 2;
        const curve = this._characterCurve(value);
        this.voices.forEach((voice) => {
          voice.nodes.forEach((node) => {
            if (node && node._superSynthOscNumber === oscNumber) {
              node.curve = curve;
              node.oversample = value > 0.38 ? "4x" : "2x";
            }
          });
        });
      }
    }

    getParam(path) {
      return path.split(".").reduce((obj, key) => obj[key], this.params);
    }

    _createOscillatorBlock(midi, oscParams, voiceOutput, oscNumber, glideFromMidi = midi, portamentoTime = 0) {
      const now = this.ctx.currentTime;
      const baseFreq =
        midiToFreq(midi) *
        semisToRatio(oscParams.pitch) *
        centsToRatio(oscParams.fine);
      const startFreq =
        midiToFreq(glideFromMidi) *
        semisToRatio(oscParams.pitch) *
        centsToRatio(oscParams.fine);
      portamentoTime = clamp(portamentoTime || 0, 0, 5);

      const nodes = [];
      const waveDepth = clamp(oscParams.waveModDepth, 0, 4);
      const waveSource = this._validModSource(oscParams.waveModSource, "lfo1");
      const pitchSource = this._validModSource(oscParams.pitchModSource, "lfo1");

      // Wave modulation strategy:
      // - LFO sources are bipolar, so crossfade between wave-depth and wave+depth.
      // - Envelope sources are unipolar, so move from base wave to base+depth.
      const isLfoWaveMod = LFO_SOURCES.has(waveSource);
      const waveA = isLfoWaveMod ? oscParams.wave - waveDepth : oscParams.wave;
      const waveB = isLfoWaveMod ? oscParams.wave + waveDepth : oscParams.wave + waveDepth;

      const oscA = this.ctx.createOscillator();
      const oscB = this.ctx.createOscillator();
      oscA.setPeriodicWave(this._createAntiAliasedWave(waveA, baseFreq));
      oscB.setPeriodicWave(this._createAntiAliasedWave(waveB, baseFreq));
      oscA.frequency.setValueAtTime(portamentoTime > 0 ? startFreq : baseFreq, now);
      oscB.frequency.setValueAtTime(portamentoTime > 0 ? startFreq : baseFreq, now);
      if (portamentoTime > 0 && Math.abs(startFreq - baseFreq) > 0.01) {
        oscA.frequency.exponentialRampToValueAtTime(Math.max(1, baseFreq), now + portamentoTime);
        oscB.frequency.exponentialRampToValueAtTime(Math.max(1, baseFreq), now + portamentoTime);
      }

      // Tiny pitch drift for alive tone, kept subtle.
      const drift = this.ctx.createOscillator();
      const driftGain = this.ctx.createGain();
      drift.type = "sine";
      drift.frequency.value = 0.10 + Math.random() * 0.22 + oscNumber * 0.04;
      driftGain.gain.value = baseFreq * 0.0015;
      drift.connect(driftGain);
      driftGain.connect(oscA.frequency);
      driftGain.connect(oscB.frequency);

      // PITCH MOD ROUTING: selected mod input -> oscillator frequencies.
      const pitchModGain = this.ctx.createGain();
      pitchModGain.gain.value = baseFreq * ((oscParams.pitchModDepth / 1200) * Math.log(2));
      this.modInputs[pitchSource].input.connect(pitchModGain);
      pitchModGain.connect(oscA.frequency);
      pitchModGain.connect(oscB.frequency);

      // WAVEFORM MOD ROUTING: selected mod input -> crossfade between two anti-aliased waves.
      const gainA = this.ctx.createGain();
      const gainB = this.ctx.createGain();
      const modInput = this.modInputs[waveSource].input;

      if (waveDepth <= 0.0001) {
        gainA.gain.value = 1;
        gainB.gain.value = 0;
      } else if (LFO_SOURCES.has(waveSource)) {
        // LFO expected -1..+1. Convert to crossfade: A=0.5-x*0.5, B=0.5+x*0.5.
        const offsetA = this.ctx.createConstantSource();
        const offsetB = this.ctx.createConstantSource();
        const toA = this.ctx.createGain();
        const toB = this.ctx.createGain();
        gainA.gain.value = 0;
        gainB.gain.value = 0;
        offsetA.offset.value = 0.5;
        offsetB.offset.value = 0.5;
        toA.gain.value = -0.5;
        toB.gain.value = 0.5;
        offsetA.connect(gainA.gain);
        offsetB.connect(gainB.gain);
        modInput.connect(toA);
        modInput.connect(toB);
        toA.connect(gainA.gain);
        toB.connect(gainB.gain);
        offsetA.start(now);
        offsetB.start(now);
        nodes.push(offsetA, offsetB, toA, toB);
      } else {
        // Envelope expected 0..1. Convert to crossfade: A=1-env, B=env.
        const offsetA = this.ctx.createConstantSource();
        const toA = this.ctx.createGain();
        gainA.gain.value = 0;
        gainB.gain.value = 0;
        offsetA.offset.value = 1;
        toA.gain.value = -1;
        offsetA.connect(gainA.gain);
        modInput.connect(toA);
        toA.connect(gainA.gain);
        modInput.connect(gainB.gain);
        offsetA.start(now);
        nodes.push(offsetA, toA);
      }

      const shaper = this._createShaper(oscParams.character);
      shaper._superSynthOscNumber = oscNumber;
      const level = this.ctx.createGain();
      level.gain.value = oscParams.volume;

      oscA.connect(gainA);
      oscB.connect(gainB);
      gainA.connect(shaper);
      gainB.connect(shaper);
      shaper.connect(level);
      level.connect(voiceOutput);

      oscA.start(now);
      oscB.start(now);
      drift.start(now);

      nodes.push(
        oscA, oscB,
        drift, driftGain,
        pitchModGain,
        gainA, gainB,
        shaper, level
      );

      return nodes;
    }

    _createSubOscillator(midi, voiceOutput, glideFromMidi = midi, portamentoTime = 0) {
      if (this.params.mixer.subVolume <= 0.001) return [];

      const now = this.ctx.currentTime;
      const osc1Pitch = this.params.osc1 ? (this.params.osc1.pitch || 0) : 0;
      const osc1Fine = this.params.osc1 ? (this.params.osc1.fine || 0) : 0;
      const subFreq = midiToFreq(midi) * semisToRatio(osc1Pitch - 12) * centsToRatio(osc1Fine);
      const subStartFreq = midiToFreq(glideFromMidi) * semisToRatio(osc1Pitch - 12) * centsToRatio(osc1Fine);
      portamentoTime = clamp(portamentoTime || 0, 0, 5);
      const sub = this.ctx.createOscillator();
      const subGain = this.ctx.createGain();

      // Dedicated sub oscillator: always square, exactly one octave below OSC 1.
      sub.setPeriodicWave(this._createAntiAliasedWave(4, subFreq));
      sub.frequency.value = portamentoTime > 0 ? subStartFreq : subFreq;
      if (portamentoTime > 0 && Math.abs(subStartFreq - subFreq) > 0.01) sub.frequency.exponentialRampToValueAtTime(Math.max(1, subFreq), now + portamentoTime);
      subGain.gain.value = this.params.mixer.subVolume;
      sub.connect(subGain);
      subGain.connect(voiceOutput);
      sub.start(now);

      return [sub, subGain];
    }

    _createNoiseSource(voiceOutput) {
      if (this.params.mixer.noiseVolume <= 0.001) return [];

      const now = this.ctx.currentTime;

function loadPatchEntry(index,quiet=false){const entry=patchBank.patches[index];if(!entry)return;currentPatchIndex=index;populatePatchSelect();try{const patch=entry.data?entry.data:EMBEDDED_PATCH_FILES[entry.file||patchFileNameForName(entry.name)];if(!patch)throw new Error("Embedded patch not found.");entry.data=patch;applyPatch(deepClone(patch));if(!quiet)patchStatus(`Loaded ${sanitizePatchName(patch.name,entry.name)}.`);}catch(err){if(!quiet)patchStatus(`Could not load ${entry.file||entry.name}: ${err.message}`);}}function loadDefaultPatch(){const patch=EMBEDDED_PATCH_FILES[DEFAULT_PATCH_FILE];if(patch)applyPatch(deepClone(patch));patchStatus("");}function populatePatchSelect(){const sel=document.getElementById("patchPresetSelect");if(!sel)return;sel.innerHTML="";patchBank.patches.forEach((p,i)=>{const opt=document.createElement("option");opt.value=i;opt.textContent=sanitizePatchName(p.name,`Patch ${i+1}`);sel.appendChild(opt);});sel.disabled=!patchBank.patches.length;if(patchBank.patches.length){currentPatchIndex=clamp(currentPatchIndex<0?0:currentPatchIndex,0,patchBank.patches.length-1);sel.value=String(currentPatchIndex);}}

function openPatchNameModal(){patchNameModalOpen=true;const modal=document.getElementById("patchNameModal"),inp=document.getElementById("patchNameModalInput"),name=document.getElementById("patchNameInput");if(inp)inp.value=name?.value||"";if(modal){modal.classList.add("open");modal.setAttribute("aria-hidden","false");}setTimeout(()=>{inp?.focus();inp?.select();},0);}function closePatchNameModal(commit){const modal=document.getElementById("patchNameModal"),inp=document.getElementById("patchNameModalInput"),name=document.getElementById("patchNameInput");if(commit&&name&&inp){name.value=sanitizePatchName(inp.value,name.value||"Untitled Patch");if(currentPatchIndex>=0&&patchBank.patches[currentPatchIndex]){patchBank.patches[currentPatchIndex].name=name.value;patchBank.patches[currentPatchIndex].file=patchBank.patches[currentPatchIndex].file||patchFileNameForName(name.value);populatePatchSelect();}}if(modal){modal.classList.remove("open");modal.setAttribute("aria-hidden","true");}patchNameModalOpen=false;name?.blur();}
function initPatchControls(){const sel=document.getElementById("patchPresetSelect"),name=document.getElementById("patchNameInput"),save=document.getElementById("patchSaveButton"),load=document.getElementById("patchLoadButton"),def=document.getElementById("patchDefaultButton"),file=document.getElementById("patchFileInput"),modalInput=document.getElementById("patchNameModalInput");if(name)name.value="Orion Strings";populatePatchSelect();updateTempoDisplay();document.getElementById("tempoButton")?.addEventListener("click",openTempoPrompt);sel?.addEventListener("change",()=>loadPatchEntry(parseInt(sel.value,10)||0));name?.addEventListener("click",e=>{e.preventDefault();openPatchNameModal();});save?.addEventListener("click",()=>{downloadPatchFile();patchStatus("");});load?.addEventListener("click",()=>file?.click());def?.addEventListener("click",loadDefaultPatch);document.getElementById("patchNameOkButton")?.addEventListener("click",()=>closePatchNameModal(true));document.getElementById("patchNameCancelButton")?.addEventListener("click",()=>closePatchNameModal(false));document.getElementById("patchNameModal")?.addEventListener("click",e=>{if(e.target.id==="patchNameModal")closePatchNameModal(false);});modalInput?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();closePatchNameModal(true);}else if(e.key==="Escape"){e.preventDefault();closePatchNameModal(false);}});file?.addEventListener("change",async()=>{const f=file.files&&file.files[0];if(!f)return;try{const patch=normalizePatchObject(JSON.parse(await f.text()),f.name.replace(/^IP_/i,"").replace(/\.patch$/i,""));if(Array.isArray(patch.lfos))patch.lfos.forEach(l=>{if(l.depth===undefined)l.depth=50;if(l.sync===undefined)l.sync=false;if(l.syncIndex===undefined)l.syncIndex=13;});const entry={name:sanitizePatchName(patch.name,"Imported Patch"),file:f.name,data:patch};patchBank.patches.push(entry);currentPatchIndex=patchBank.patches.length-1;populatePatchSelect();applyPatch(patch);patchStatus("");}catch(e
